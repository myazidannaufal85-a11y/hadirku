<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HADIRKU Guru</title>
<style>
:root{--bg:#f2f5f6;--card:#fff;--ink:#14212a;--mut:#5f6f79;--line:#d9e1e5;--pri:#0b5c6b;--on:#fff;--bad:#b3261e;--ok:#1b7a46;--warn:#946200}
@media(prefers-color-scheme:dark){:root{--bg:#0e1519;--card:#162027;--ink:#e6eef2;--mut:#93a4ad;--line:#26343d;--pri:#4fb4c6;--on:#06232a;--bad:#f2837b;--ok:#5cc88a;--warn:#e2b44f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 8px}
header b{font-size:19px}header small{display:block;color:var(--mut);font-size:12.5px}
nav{display:flex;gap:6px;padding:6px 0 10px}
nav button{flex:1;background:transparent;color:var(--mut);border:1px solid var(--line)}
nav button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
button{font:inherit;font-weight:600;background:var(--pri);color:var(--on);border:1px solid var(--pri);border-radius:8px;padding:10px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--pri)}button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
label.chk{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;margin:16px 0 0}
input[type=checkbox]{width:auto;accent-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.top{font-size:17px;margin-bottom:6px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tag{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.masuk{color:var(--ok)}.tidak_masuk{color:var(--warn)}.terlewat{color:var(--bad)}.belum_dicatat,.dibatalkan{color:var(--mut)}
.mut{color:var(--mut);margin:8px 0 0}.bad{color:var(--bad);margin:8px 0 0}.empty{color:var(--mut);padding:10px 0}
.cd{margin:10px 0 8px;font-size:14px;color:var(--mut)}.cd b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.acts{display:grid;gap:8px}.date{color:var(--mut);margin:4px 0 12px}
h2{font-size:15px;margin:18px 0 6px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}#toast.err{background:var(--bad);color:#fff}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:10}
#sheet .box{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0))}
#sheet h2{margin-top:0;font-size:17px}
#auth{max-width:400px;margin:8vh auto 0;padding:0 14px}#auth h1{font-size:24px;margin:0 0 4px}
#auth p{color:var(--mut);margin:0 0 6px}#auth button{width:100%;margin-top:14px}#auth button.ghost{margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="auth" hidden></div>
<div id="main" class="wrap" hidden>
  <header><div><b>HADIRKU</b><small id="who"></small></div><button class="ghost" data-act="logout">Keluar</button></header>
  <nav><button data-tab="home">Hari ini</button><button data-tab="hist">Riwayat</button></nav>
  <div id="view"></div>
</div>
<div id="sheet" hidden></div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const LS='hadirku_cfg',TZ='Asia/Makassar',KAT=['Sakit','Izin Dinas','Izin Pribadi','Cuti'];
const STAT={belum_dicatat:'Belum dicatat',masuk:'Masuk',tidak_masuk:'Tidak masuk',terlewat:'Terlewat',dibatalkan:'Dibatalkan'};
const SEL='*,kelas(nama_kelas),mapels(nama_mapel),journals(*)';
let sb,uid,tab='home',groups=[],win=15,sig='';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=t=>String(t).slice(0,5);
const secs=t=>{const p=String(t).split(':');return (+p[0])*3600+(+p[1])*60+(+p[2]||0)};
const dateStr=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const hhmm=ms=>new Date(ms).toLocaleTimeString('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const nowSecs=()=>{const w=new Date(new Date().toLocaleString('en-US',{timeZone:TZ}));return w.getHours()*3600+w.getMinutes()*60+w.getSeconds()};
const jr=s=>Array.isArray(s.journals)?s.journals[0]:s.journals;
const lockAt=j=>new Date(j.waktu_input).getTime()+36e5;
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3800)}
async function q(p){const r=await p;if(r.error)throw r.error;return r.data}
function cfgGet(){if(window.HADIRKU_CFG&&window.HADIRKU_CFG.url&&window.HADIRKU_CFG.key)return window.HADIRKU_CFG;try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function show(id){$('#auth').hidden=id!=='auth';$('#main').hidden=id!=='main'}

/* ---------- Masuk, daftar, koneksi ---------- */
function setup(){show('auth');$('#auth').innerHTML=`<h1>Hubungkan database</h1><p>Isi sekali saja. Nilainya ada di Supabase: Project Settings, lalu API Keys.</p>
<label>Project URL</label><input id="u" placeholder="https://xxxx.supabase.co" autocapitalize="none"><label>Publishable (anon) key</label><input id="k" autocapitalize="none">
<button data-act="savecfg">Simpan dan lanjut</button>`}
function authUI(mode,msg){show('auth');const reg=mode==='daftar';
$('#auth').innerHTML=`<h1>HADIRKU</h1><p>${esc(msg||(reg?'Daftar sebagai guru. Akun aktif setelah disetujui admin.':'Masuk untuk mencatat kehadiran mengajar.'))}</p>
${reg?'<label>Nama lengkap dan gelar</label><input id="n" autocomplete="name">':''}
<label>Email</label><input id="e" type="email" autocomplete="username" autocapitalize="none">
<label>Kata sandi${reg?' (minimal 6 karakter)':''}</label><input id="p" type="password" autocomplete="${reg?'new-password':'current-password'}">
<button data-act="${reg?'signup':'login'}">${reg?'Daftar':'Masuk'}</button>
<button class="ghost" data-act="${reg?'tologin':'toreg'}">${reg?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'}</button>
${window.HADIRKU_CFG?'':'<button class="ghost" data-act="resetcfg">Ubah koneksi database</button>'}`}
function pending(){show('auth');$('#auth').innerHTML=`<h1>Menunggu persetujuan</h1><p>Akun Anda sudah terdaftar. Admin sekolah perlu menyetujuinya sebelum Anda bisa mencatat kehadiran.</p>
<button data-act="recheck">Periksa lagi</button><button class="ghost" data-act="logout">Keluar</button>`}
async function enter(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return authUI('masuk');
  uid=user.id;
  const {data:me}=await sb.from('profiles').select('nama,status_aktif').eq('id',uid).maybeSingle();
  if(!me){await sb.auth.signOut();return authUI('masuk','Profil tidak ditemukan. Hubungi admin.')}
  if(!me.status_aktif)return pending();
  $('#who').textContent=me.nama;show('main');
  const s=await sb.from('school_settings').select('attendance_window_minutes').eq('id',1).maybeSingle();
  if(s.data)win=s.data.attendance_window_minutes;
  render();
}

/* ---------- Tampilan ---------- */
async function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#view').innerHTML='<p class="empty">Memuat…</p>';
  try{if(tab==='home'){await loadHome();renderHome()}else $('#view').innerHTML=await vHist()}
  catch(e){$('#view').innerHTML='<p class="empty">Gagal memuat data.</p>';toast(e.message,1)}
}
async function loadHome(){
  const d=dateStr(),get=()=>q(sb.from('daily_sessions').select(SEL).eq('guru_id',uid).eq('tanggal',d).order('jam_mulai'));
  let rows=await get();
  { // cadangan: buat sesi hari ini untuk jadwal sendiri yang belum punya sesi
    const iso=new Date(d+'T00:00:00').getDay()||7;
    const sc=await q(sb.from('schedules').select('*').eq('guru_id',uid).eq('hari_id',iso));
    const have=new Set(rows.map(s=>s.schedule_id)),miss=sc.filter(s=>!have.has(s.id));
    if(miss.length){
      const r=await sb.from('daily_sessions').upsert(miss.map(s=>({schedule_id:s.id,guru_id:uid,mapel_id:s.mapel_id,kelas_id:s.kelas_id,tanggal:d,jam_mulai:s.jam_mulai,jam_selesai:s.jam_selesai})),{onConflict:'schedule_id,tanggal',ignoreDuplicates:true});
      if(r.error)toast('Sesi dari jadwal gagal dibuat: '+r.error.message,1);
      rows=await get();
    }
  }
  const m={};rows.forEach(s=>{const k=s.jam_mulai+'|'+s.jam_selesai;(m[k]=m[k]||{mulai:s.jam_mulai,selesai:s.jam_selesai,items:[]}).items.push(s)});
  groups=Object.values(m);
}
const pend=g=>g.items.filter(s=>s.status==='belum_dicatat');
function phase(g){if(!pend(g).length)return 'done';const n=nowSecs(),st=secs(g.mulai);return n<st?'wait':n<=st+win*60?'open':'late'}
const editable=g=>g.items.some(s=>{const j=jr(s);return j&&Date.now()<lockAt(j)});
const gsig=()=>groups.map(g=>phase(g)+editable(g)).join();
function card(g,i){
  const ph=phase(g),js=g.items.map(jr).filter(Boolean);let act='';
  if(ph==='wait')act=`<p class="mut">Pencatatan dibuka pukul ${hm(g.mulai)}.</p>`;
  if(ph==='open')act=`<div class="cd">Sisa waktu mencatat<br><b data-cd="${secs(g.mulai)+win*60}">--:--</b></div><div class="acts"><button data-act="masuk" data-g="${i}">Saya Masuk Kelas</button><button class="ghost" data-act="absen" data-g="${i}">Saya Tidak Masuk</button></div>`;
  if(ph==='late')act='<p class="bad">Waktu pencatatan sudah lewat dan sesi terkunci. Hubungi admin bila perlu koreksi.</p>';
  if(ph==='done'&&g.items.some(s=>s.status==='terlewat'))act='<p class="bad">Sesi ini terlewat karena tidak dicatat dalam batas waktu dan sudah terkunci. Hubungi admin bila perlu koreksi.</p>';
  if(js.some(j=>j.diterbitkan))act+='<p class="mut">Tugas ditampilkan ke murid di Portal Murid.</p>';
  if(js.length){const t=Math.min(...js.map(lockAt));act+=Date.now()<t?`<p class="mut">Jurnal bisa diubah sampai pukul ${hhmm(t)}.</p><div class="acts" style="margin-top:8px"><button class="ghost" data-act="ubah" data-g="${i}">Ubah jurnal</button></div>`:'<p class="mut">Jurnal terkunci.</p>'}
  return `<div class="card"><div class="top"><b>${hm(g.mulai)} sampai ${hm(g.selesai)}</b></div>${g.items.map(s=>`<div class="it"><span>${esc(s.kelas.nama_kelas)}, ${esc(s.mapels.nama_mapel)}</span><span class="tag ${s.status}">${STAT[s.status]}</span></div>`).join('')}${act}</div>`;
}
function renderHome(){
  sig=gsig();
  const hari=new Date().toLocaleDateString('id-ID',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('#view').innerHTML=`<p class="date">${hari}</p>`+(groups.map(card).join('')||'<p class="empty">Tidak ada sesi mengajar hari ini. Jika seharusnya ada, hubungi admin untuk memeriksa jadwal Anda.</p>');
  cd();
}
function cd(){const n=nowSecs();document.querySelectorAll('[data-cd]').forEach(e=>{const r=Math.max(0,+e.dataset.cd-n);e.textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0')})}
setInterval(()=>{if($('#main').hidden||tab!=='home'||!groups.length)return;gsig()!==sig?renderHome():cd()},1000);

async function vHist(){
  const d=await q(sb.from('daily_sessions').select('*,kelas(nama_kelas),mapels(nama_mapel)').eq('guru_id',uid).order('tanggal',{ascending:false}).order('jam_mulai').limit(80));
  if(!d.length)return '<p class="empty">Belum ada riwayat mengajar.</p>';
  let last='',h='';
  d.forEach(s=>{if(s.tanggal!==last){last=s.tanggal;h+=`<h2>${new Date(s.tanggal+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>`}
    h+=`<div class="card" style="padding:6px 14px;margin-bottom:6px"><div class="it" style="border:0"><span>${hm(s.jam_mulai)}, ${esc(s.kelas.nama_kelas)}, ${esc(s.mapels.nama_mapel)}</span><span class="tag ${s.status}">${STAT[s.status]}</span></div></div>`});
  return h;
}

/* ---------- Lembar isian ---------- */
function sheet(h){$('#sheet').innerHTML=`<div class="box">${h}<button class="ghost" data-act="close" style="width:100%;margin-top:8px">Batal</button></div>`;$('#sheet').hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML=''}
const list=g=>`<p class="mut" style="margin:0 0 6px">${g.items.map(s=>esc(s.kelas.nama_kelas)).join(', ')}</p>`;
const kopt=v=>KAT.map(k=>`<option${k===v?' selected':''}>${k}</option>`).join('');
function formAbsen(g,i){sheet(`<h2>Saya Tidak Masuk</h2>${list(g)}<form data-form="absen" data-g="${i}">
<label>Kategori alasan</label><select name="kat" required>${kopt()}</select>
<label>Keterangan</label><textarea name="alasan"></textarea>
<label>Tugas untuk siswa</label><textarea name="tugas"></textarea>
<label>Foto tugas (maksimal 1)</label><input type="file" name="foto" accept="image/*">
<label class="chk"><input type="checkbox" name="pub"> Tampilkan tugas dan foto ke murid</label>
<p class="mut" style="margin:4px 0 0;font-size:13px">Jika dicentang, tugas dan foto tampil di Portal Murid. Kategori alasan dan keterangan tidak pernah tampil. Jangan menulis alasan pribadi di kolom tugas.</p>
<button style="width:100%;margin-top:14px">Kirim</button></form>`)}
function formUbah(g,i){const js=g.items.map(jr).filter(Boolean),f=js[0],ab=f.alasan_kategori!=null;
sheet(`<h2>Ubah jurnal</h2>${list(g)}<form data-form="ubah" data-g="${i}">
${ab?`<label>Kategori alasan</label><select name="kat">${kopt(f.alasan_kategori)}</select><label>Keterangan</label><textarea name="alasan">${esc(f.alasan_teks)}</textarea>`:''}
<label>${ab?'Tugas untuk siswa':'Catatan pembelajaran'}</label><textarea name="tugas">${esc(f.tugas_teks)}</textarea>
<label class="chk"><input type="checkbox" name="pub"${f.diterbitkan?' checked':''}> Tampilkan ke murid</label>
<p class="mut" style="margin:4px 0 0;font-size:13px">Jika dicentang, teks${ab?' dan foto':''} di atas tampil di Portal Murid. Kategori alasan dan keterangan tidak pernah tampil.</p>
<button style="width:100%;margin-top:14px">Simpan perubahan</button></form>`)}
function shrink(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);
im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Foto gagal diproses.')),'image/jpeg',.8)};
im.onerror=()=>no(new Error('File yang dipilih bukan gambar.'));im.src=u})}

/* ---------- Aksi ---------- */
async function reload(){closeSheet();await loadHome();renderHome()}
async function act(el){
  const a=el.dataset.act,g=groups[+el.dataset.g];
  if(a==='savecfg'){const url=$('#u').value.trim(),key=$('#k').value.trim();if(!/^https:\/\//.test(url)||key.length<20)return toast('URL atau key belum benar.',1);
    try{localStorage.setItem(LS,JSON.stringify({url,key}))}catch(e){}return boot()}
  if(a==='resetcfg'){try{localStorage.removeItem(LS)}catch(e){}return setup()}
  if(a==='toreg')return authUI('daftar');
  if(a==='tologin')return authUI('masuk');
  if(a==='login'){const {error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});return error?toast('Email atau kata sandi salah.',1):enter()}
  if(a==='signup'){const nama=$('#n').value.trim(),pw=$('#p').value;if(!nama)return toast('Nama lengkap wajib diisi.',1);if(pw.length<6)return toast('Kata sandi minimal 6 karakter.',1);
    const {data,error}=await sb.auth.signUp({email:$('#e').value.trim(),password:pw,options:{data:{nama}}});
    if(error)return toast(error.message,1);
    return data.session?enter():authUI('masuk','Pendaftaran berhasil. Periksa email Anda untuk konfirmasi, lalu masuk.')}
  if(a==='recheck')return enter();
  if(a==='logout'){await sb.auth.signOut();closeSheet();return authUI('masuk')}
  if(a==='close')return closeSheet();
  if(a==='absen')return formAbsen(g,el.dataset.g);
  if(a==='ubah')return formUbah(g,el.dataset.g);
  if(a==='masuk'){el.disabled=true;try{await q(sb.from('journals').insert(pend(g).map(s=>({session_id:s.id,guru_id:uid}))));toast('Kehadiran tercatat.')}finally{el.disabled=false}await reload()}
}
async function submit(f){
  const g=groups[+f.dataset.g],d=Object.fromEntries(new FormData(f)),btn=f.querySelector('button');btn.disabled=true;
  try{
    if(f.dataset.form==='absen'){
      const file=f.foto.files[0],blob=file?await shrink(file):null,rows=[];
      for(const s of pend(g)){let path=null;
        if(blob){path=uid+'/'+s.id+'.jpg';const {error}=await sb.storage.from('tugas-foto').upload(path,blob,{contentType:'image/jpeg'});
          if(error&&!/exist|duplicate/i.test(error.message))throw new Error('Foto gagal diunggah: '+error.message)}
        rows.push({session_id:s.id,guru_id:uid,alasan_kategori:d.kat,alasan_teks:(d.alasan||'').trim()||null,tugas_teks:(d.tugas||'').trim()||null,foto_url:path,diterbitkan:!!d.pub})}
      await q(sb.from('journals').insert(rows));toast('Jurnal tersimpan.');
    }else{
      const up={tugas_teks:(d.tugas||'').trim()||null,diterbitkan:!!d.pub};if(d.kat){up.alasan_kategori=d.kat;up.alasan_teks=(d.alasan||'').trim()||null}
      const ids=g.items.map(jr).filter(Boolean).map(j=>j.id),r=await q(sb.from('journals').update(up).in('id',ids).select());
      if(!r.length)throw new Error('Batas 60 menit sudah lewat, jurnal terkunci.');toast('Perubahan tersimpan.');
    }
    await reload();
  }catch(e){toast(e.message,1);btn.disabled=false}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;return render()}
  const b=e.target.closest('[data-act]');if(b)act(b).catch(x=>toast(x.message,1));
});
document.addEventListener('submit',e=>{e.preventDefault();submit(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='p'){const b=document.querySelector('#auth [data-act=login],#auth [data-act=signup]');if(b)act(b).catch(x=>toast(x.message,1))}});
function boot(){const c=cfgGet();if(!c)return setup();sb=supabase.createClient(c.url,c.key);enter().catch(x=>toast(x.message,1))}
boot();
</script>
</body>
</html>
