<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HADIRKU Admin</title>
<style>
:root{--bg:#f2f5f6;--card:#fff;--ink:#14212a;--mut:#5f6f79;--line:#d9e1e5;--pri:#0b5c6b;--on:#fff;--soft:#dcedf0;--bad:#b3261e;--ok:#1b7a46;--warn:#946200}
@media(prefers-color-scheme:dark){:root{--bg:#0e1519;--card:#162027;--ink:#e6eef2;--mut:#93a4ad;--line:#26343d;--pri:#4fb4c6;--on:#06232a;--soft:#183840;--bad:#f2837b;--ok:#5cc88a;--warn:#e2b44f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 8px}
header b{font-size:19px;letter-spacing:.2px}header small{display:block;color:var(--mut);font-size:12.5px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:none;background:transparent;color:var(--mut);border:1px solid var(--line);padding:8px 13px}
nav button.on{background:var(--pri);color:var(--on);border-color:var(--pri)}
h2{font-size:15px;margin:22px 0 8px}
button{font:inherit;font-weight:600;background:var(--pri);color:var(--on);border:1px solid var(--pri);border-radius:8px;padding:9px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--pri)}button.bad{color:var(--bad);border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row small{display:block;color:var(--mut);font-size:13px}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px}
.inl{display:flex;gap:8px;margin-bottom:8px}.inl button{flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tag{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.masuk{color:var(--ok)}.tidak_masuk{color:var(--warn)}.terlewat{color:var(--bad)}.belum_dicatat,.dibatalkan{color:var(--mut)}
.empty{color:var(--mut);padding:10px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sum{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:13.5px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}#toast.err{background:var(--bad);color:#fff}
#auth{max-width:400px;margin:9vh auto 0;padding:0 14px}#auth h1{font-size:24px;margin:0 0 4px}
#auth p{color:var(--mut);margin:0 0 14px}#auth button{width:100%;margin-top:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="auth" hidden></div>
<div id="main" class="wrap" hidden>
  <header><div><b>HADIRKU</b><small id="who"></small></div><button class="ghost" data-act="logout">Keluar</button></header>
  <nav id="nav"></nav>
  <div id="view"></div>
</div>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const LS='hadirku_cfg';
let sb,tab='rekap',date='';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HARI=['','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const STAT={belum_dicatat:'Belum dicatat',masuk:'Masuk',tidak_masuk:'Tidak masuk',terlewat:'Terlewat',dibatalkan:'Dibatalkan'};
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Makassar'});
const hm=t=>String(t||'').slice(0,5);
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3600)}
async function q(p){const r=await p;if(r.error){toast(r.error.message,1);throw r.error}return r.data}
function cfgGet(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}

/* ---------- Layar masuk & pengaturan koneksi ---------- */
function show(id){['auth','main'].forEach(x=>$('#'+x).hidden=x!==id)}
function setup(){
  show('auth');
  $('#auth').innerHTML=`<h1>Hubungkan database</h1><p>Isi sekali saja. Nilainya ada di Supabase: Project Settings, lalu API.</p>
  <label>Project URL</label><input id="u" placeholder="https://xxxx.supabase.co" autocapitalize="none">
  <label>Publishable (anon) key</label><input id="k" autocapitalize="none">
  <button data-act="savecfg">Simpan dan lanjut</button>`;
}
function login(msg){
  show('auth');
  $('#auth').innerHTML=`<h1>HADIRKU Admin</h1><p>${esc(msg||'Masuk dengan akun admin sekolah.')}</p>
  <label>Email</label><input id="e" type="email" autocomplete="username" autocapitalize="none">
  <label>Kata sandi</label><input id="p" type="password" autocomplete="current-password">
  <button data-act="login">Masuk</button>
  <button class="ghost" data-act="resetcfg" style="margin-top:8px">Ubah koneksi database</button>`;
}
async function enter(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user)return login();
  const {data:me}=await sb.from('profiles').select('nama,role,status_aktif').eq('id',user.id).maybeSingle();
  if(!me||me.role!=='admin'||!me.status_aktif){await sb.auth.signOut();return login('Akun ini bukan admin aktif.')}
  $('#who').textContent=me.nama;date=today();show('main');render();
}

/* ---------- Tab ---------- */
const TABS=[['rekap','Rekap'],['guru','Guru'],['jadwal','Jadwal'],['master','Kelas dan Mapel'],['set','Pengaturan']];
async function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-tab="${k}">${l}</button>`).join('');
  $('#view').innerHTML='<p class="empty">Memuat…</p>';
  try{$('#view').innerHTML=await V[tab]()}catch(e){$('#view').innerHTML='<p class="empty">Gagal memuat data. Periksa pesan di bawah layar.</p>'}
}
const opts=(a,v,t,sel)=>a.map(x=>`<option value="${x[v]}"${x[v]===sel?' selected':''}>${esc(typeof t==='function'?t(x):x[t])}</option>`).join('');

async function vRekap(){
  const d=await q(sb.from('daily_sessions').select('*,profiles(nama),kelas(nama_kelas),mapels(nama_mapel)').eq('tanggal',date).order('jam_mulai'));
  const c={};d.forEach(x=>c[x.status]=(c[x.status]||0)+1);
  return `<label>Tanggal</label><input type="date" id="tgl" value="${date}">
  <div class="acts"><button data-act="gen">Buat sesi tanggal ini</button><button class="ghost" data-act="missed">Tandai sesi terlewat</button></div>
  <div class="sum">${Object.keys(STAT).map(k=>`<span>${STAT[k]}: <b>${c[k]||0}</b></span>`).join('')}</div>
  <div class="list">${d.map(x=>`<div class="row"><div><b>${esc(x.profiles&&x.profiles.nama)}</b><small>${hm(x.jam_mulai)} sampai ${hm(x.jam_selesai)}, ${esc(x.kelas&&x.kelas.nama_kelas)}, ${esc(x.mapels&&x.mapels.nama_mapel)}</small></div>
  <div style="text-align:right"><span class="tag ${x.status}">${STAT[x.status]}</span>${x.status==='belum_dicatat'||x.status==='terlewat'?`<br><button class="ghost bad" style="margin-top:6px;padding:4px 10px" data-act="cancel" data-id="${x.id}">Batalkan</button>`:''}</div></div>`).join('')||'<p class="empty">Belum ada sesi pada tanggal ini. Ketuk Buat sesi tanggal ini.</p>'}</div>`;
}
async function vGuru(){
  const d=await q(sb.from('profiles').select('*').eq('role','guru').order('nama'));
  const row=x=>`<div class="row"><div><b>${esc(x.nama)}</b><small>${x.status_aktif?'Aktif':'Menunggu persetujuan'}</small></div>
  <div class="acts" style="margin:0"><button class="ghost" data-act="rename" data-id="${x.id}" data-v="${esc(x.nama)}">Ubah nama</button>
  <button class="${x.status_aktif?'ghost bad':''}" data-act="toggle" data-id="${x.id}" data-v="${!x.status_aktif}">${x.status_aktif?'Nonaktifkan':'Setujui'}</button></div></div>`;
  const w=d.filter(x=>!x.status_aktif),a=d.filter(x=>x.status_aktif);
  return `<h2>Menunggu persetujuan (${w.length})</h2><div class="list">${w.map(row).join('')||'<p class="empty">Tidak ada pendaftar baru.</p>'}</div>
  <h2>Guru aktif (${a.length})</h2><div class="list">${a.map(row).join('')||'<p class="empty">Belum ada guru aktif.</p>'}</div>`;
}
async function vJadwal(){
  const [g,k,m,s]=await Promise.all([
    q(sb.from('profiles').select('id,nama').eq('role','guru').eq('status_aktif',true).order('nama')),
    q(sb.from('kelas').select('*').order('nama_kelas')),q(sb.from('mapels').select('*').order('nama_mapel')),
    q(sb.from('schedules').select('*,profiles(nama),kelas(nama_kelas),mapels(nama_mapel)').order('hari_id').order('jam_mulai'))]);
  if(!g.length||!k.length||!m.length)return '<p class="empty">Isi dulu guru aktif, kelas, dan mata pelajaran sebelum membuat jadwal.</p>';
  return `<h2>Tambah jadwal</h2><form class="box" data-form="jadwal">
  <label>Guru</label><select name="guru_id">${opts(g,'id','nama')}</select>
  <div class="grid"><div><label>Kelas</label><select name="kelas_id">${opts(k,'id','nama_kelas')}</select></div>
  <div><label>Mata pelajaran</label><select name="mapel_id">${opts(m,'id','nama_mapel')}</select></div>
  <div><label>Hari</label><select name="hari_id">${HARI.slice(1).map((h,i)=>`<option value="${i+1}">${h}</option>`).join('')}</select></div><div></div>
  <div><label>Mulai</label><input type="time" name="jam_mulai" value="07:00" required></div>
  <div><label>Selesai</label><input type="time" name="jam_selesai" value="07:45" required></div></div>
  <button style="width:100%;margin-top:14px">Simpan jadwal</button></form>
  <p class="empty">Satu guru mengajar dua kelas di jam yang sama? Simpan dua jadwal, satu per kelas.</p>
  <h2>Jadwal mingguan (${s.length})</h2><div class="list">${s.map(x=>`<div class="row"><div><b>${HARI[x.hari_id]}, ${hm(x.jam_mulai)} sampai ${hm(x.jam_selesai)}</b>
  <small>${esc(x.profiles&&x.profiles.nama)}, ${esc(x.kelas&&x.kelas.nama_kelas)}, ${esc(x.mapels&&x.mapels.nama_mapel)}</small></div>
  <button class="ghost bad" data-act="del" data-tb="schedules" data-id="${x.id}">Hapus</button></div>`).join('')||'<p class="empty">Belum ada jadwal.</p>'}</div>`;
}
async function vMaster(){
  const [k,m]=await Promise.all([q(sb.from('kelas').select('*').order('nama_kelas')),q(sb.from('mapels').select('*').order('nama_mapel'))]);
  const blk=(t,tb,col,a)=>`<h2>${t} (${a.length})</h2><form class="inl" data-form="add" data-tb="${tb}" data-col="${col}"><input name="v" placeholder="Nama baru" required><button>Tambah</button></form>
  <div class="list">${a.map(x=>`<div class="row"><b>${esc(x[col])}</b><button class="ghost bad" data-act="del" data-tb="${tb}" data-id="${x.id}">Hapus</button></div>`).join('')||'<p class="empty">Belum ada data.</p>'}</div>`;
  return blk('Kelas','kelas','nama_kelas',k)+blk('Mata pelajaran','mapels','nama_mapel',m);
}
async function vSet(){
  const s=await q(sb.from('school_settings').select('*').eq('id',1).single());
  return `<h2>Pengaturan sekolah</h2><form class="box" data-form="set">
  <label>Nama sekolah</label><input name="school_name" value="${esc(s.school_name)}" required>
  <div class="grid"><div><label>Jam sekolah mulai</label><input type="time" name="start_school_time" value="${hm(s.start_school_time)}" required></div>
  <div><label>Jam sekolah selesai</label><input type="time" name="end_school_time" value="${hm(s.end_school_time)}" required></div></div>
  <label>Batas waktu pencatatan (menit sejak jam mulai)</label><input type="number" min="1" name="attendance_window_minutes" value="${s.attendance_window_minutes}" required>
  <button style="width:100%;margin-top:14px">Simpan pengaturan</button></form>`;
}
const V={rekap:vRekap,guru:vGuru,jadwal:vJadwal,master:vMaster,set:vSet};

/* ---------- Aksi ---------- */
async function act(el){
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='savecfg'){const url=$('#u').value.trim(),key=$('#k').value.trim();
    if(!/^https:\/\//.test(url)||key.length<20)return toast('URL atau key belum benar.',1);
    try{localStorage.setItem(LS,JSON.stringify({url,key}))}catch(e){}return boot()}
  if(a==='resetcfg'){try{localStorage.removeItem(LS)}catch(e){}return setup()}
  if(a==='login'){const {error}=await sb.auth.signInWithPassword({email:$('#e').value.trim(),password:$('#p').value});
    return error?toast('Email atau kata sandi salah.',1):enter()}
  if(a==='logout'){await sb.auth.signOut();return login()}
  if(a==='toggle'){await q(sb.from('profiles').update({status_aktif:el.dataset.v==='true'}).eq('id',id));toast('Status guru diperbarui.')}
  if(a==='rename'){const n=prompt('Nama guru',el.dataset.v);if(!n||!n.trim())return;await q(sb.from('profiles').update({nama:n.trim()}).eq('id',id));toast('Nama diperbarui.')}
  if(a==='del'){if(!confirm('Hapus data ini?'))return;await q(sb.from(el.dataset.tb).delete().eq('id',id));toast('Data dihapus.')}
  if(a==='cancel'){if(!confirm('Batalkan sesi ini?'))return;await q(sb.from('daily_sessions').update({status:'dibatalkan'}).eq('id',id));toast('Sesi dibatalkan.')}
  if(a==='gen'){const n=await q(sb.rpc('generate_daily_sessions',{p_tanggal:date}));toast(n+' sesi dibuat.')}
  if(a==='missed'){const n=await q(sb.rpc('mark_missed_sessions'));toast(n+' sesi ditandai terlewat.')}
  render();
}
async function submit(f){
  const t=f.dataset.form,d=Object.fromEntries(new FormData(f));
  if(t==='add'){await q(sb.from(f.dataset.tb).insert({[f.dataset.col]:d.v.trim()}))}
  if(t==='jadwal'){d.hari_id=+d.hari_id;await q(sb.from('schedules').insert(d))}
  if(t==='set'){d.attendance_window_minutes=+d.attendance_window_minutes;await q(sb.from('school_settings').update(d).eq('id',1))}
  toast('Tersimpan.');render();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;return render()}
  const b=e.target.closest('[data-act]');if(b)act(b).catch(()=>{});
});
document.addEventListener('submit',e=>{e.preventDefault();submit(e.target).catch(()=>{})});
document.addEventListener('change',e=>{if(e.target.id==='tgl'&&e.target.value){date=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='p')act(document.querySelector('[data-act=login]'))});

function boot(){
  const c=cfgGet();if(!c)return setup();
  sb=supabase.createClient(c.url,c.key);enter();
}
boot();
</script>
</body>
</html>
